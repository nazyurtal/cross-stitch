stitch-width" type="range" min="10" max="44" value="18"></div><div class="cs-setting"><div class="cs-setting-head"><label for="stitch-fluff">Yarn softness</label><input class="cs-number" id="fluff-value" type="number" min="0" max="100" step="1" value="82" data-range="stitch-fluff" aria-label="Yarn softness value"></div><input  id="stitch-fluff" type="range" min="0" max="100" value="82"></div><div class="cs-section-title">NATURAL TEXTURE</div><div class="cs-setting"><div class="cs-setting-head"><label for="stitch-organic">Handmade variation</label><input class="cs-number" id="organic-value" type="number" min="0" max="100" step="1" value="35" data-range="stitch-organic" aria-label="Handmade variation value"></div><input id="stitch-organic" type="range" min="0" max="100" value="35"></div><div class="cs-setting"><div class="cs-setting-head"><label for="stitch-tone">Thread tone variation</label><input class="cs-number" id="tone-value" type="number" min="0" max="100" step="1" value="18" data-range="stitch-tone" aria-label="Thread tone variation value"></div><input id="stitch-tone" type="range" min="0" max="100" value="18"></div><div class="cs-setting"><div class="cs-setting-head"><label for="stitch-relief">Thread depth</label><input class="cs-number" id="relief-value" type="number" min="0" max="100" step="1" value="45" data-range="stitch-relief" aria-label="Thread depth value"></div><input id="stitch-relief" type="range" min="0" max="100" value="45"></div><label class="form-check"><input id="stitch-shadows" type="checkbox" checked><span class="form-check-label">Soft stitch shadows</span></label><div class="cs-section-title">BACKGROUND</div><label class="form-check"><input  id="stitch-remove" type="checkbox" checked><span class="form-check-label">Remove background</span></label><div class="cs-color-field"><label class="form-label" for="stitch-key">Background</label><div class="cs-color-picker"><span class="cs-color-swatch"><input type="color" id="stitch-key" value="#ffffff </style><script>
(()=>{

let previewTimer;
function schedule(){
  clearTimeout(previewTimer);

}
function saveState(){const values={};root.querySelectorAll('input:not([type=file])').forEach(n=>values[n.id]=n.type==='checkbox'?n.checked:n.value);window.openai?.setWidgetState?.({modelContent:{tool:'Cross Stitch',settings:values},privateContent:null}).catch(()=>{})}

root.querySelectorAll('.cs-number').forEach(n=>{

n.addEventListener('input',apply);n.addEventListener('change',()=>{const r=el(n.dataset.range);let v=n.valueAsNumber;if(!Number.isFinite(v))v=Number(r.value);n.value=String(Math.round(Math.max(+r.min,Math.min(+r.max,v))));apply()});n.addEventListener('keydown',e=>{if(e.key==='Enter')n.blur()});n.addEventListener('blur',()=>n.dispatchEvent(new Event('change')))

function loadImageFile(file){if(!file)return;const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const scale=Math.min(1,1600/Math.max(img.width,img.height));source.width=Math.max(1,Math.round(img.width*scale));source.height=Math.max(1,Math.round(img.height*scale));sc.clearRect(0,0,source.width,source.height);sc.drawImage(img,0,0,source.width,source.height);URL.revokeObjectURL(url);uploaded=true;updateExportInfo();el('stitch-upload-name').textContent=file.name;changeZoom(1);el('stitch-status').textContent=file.name+' · '+source.width+' × '+source.height;schedule()};img.onerror=()=>{URL.revokeObjectURL(url);el('stitch-status').textContent='Could not open image. Try a PNG or JPG file.'};img.src=url}

function exportScale(){return Math.min(Number(el('export-scale').value),8192/Math.max(source.width,source.height),Math.sqrt(32000000/(source.width*source.height)))}
function updateExportInfo(){const format=el('export-format').value,scale=exportScale();el('export-quality-value').value=el('export-quality').value;el('export-quality-label').hidden=format==='png';el('export-info').textContent=Math.round(source.width*scale)+' × '+Math.round(source.height*scale)+' px'+(format==='jpeg'?' · White background':'');el('save-stitch').innerHTML='<span aria-hidden="true">⤓</span> Download '+format.toUpperCase()}
